 /* Font Options */

font_family           Comic Code Ligatures
font_size             10

# Nerd Font icons: pull these codepoints from the Nerd Font directly, bypassing
# fontconfig fallback (which now grabs Material Symbols -> tiny/missing glyphs).
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58 Symbols Nerd Font Mono
symbol_map U+E000-U+E00A Symbols Nerd Font Mono
symbol_map U+E0A0-U+E0C8,U+E0CA,U+E0CC-U+E0D7 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9 Symbols Nerd Font Mono
symbol_map U+E300-U+E3E3 Symbols Nerd Font Mono
symbol_map U+E5FA-U+E6B7 Symbols Nerd Font Mono
symbol_map U+E700-U+E8EF Symbols Nerd Font Mono
symbol_map U+EA60-U+EC1E Symbols Nerd Font Mono
symbol_map U+ED00-U+EFCE Symbols Nerd Font Mono
symbol_map U+F000-U+F2FF Symbols Nerd Font Mono
symbol_map U+F300-U+F381 Symbols Nerd Font Mono
symbol_map U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono
background_opacity    0.80

/* Window Layout Options*/

remember_window_size  yes
draw_minimal_borders  yes

/* Disable annoying bell */

enable_audio_bell no

/* Cursor shape */

cursor_shape                block
shell_integration           no-cursor

/* Default Options */

scrollback_lines        10000
mouse_hide_wait         -2.0
open_url_with           default
copy_on_select          yes
tab_bar_style           powerline
update_check_interval   0
confirm_os_window_close 0
map shift+insert        paste_from_clipboard
map alt+enter           new_os_window_with_cwd
modify_font             underline_thickness 300%
hide_window_decorations yes

# OSC52 clipboard writes from remote TUIs (opencode in devpod containers,
# tmux set-clipboard external forwards). Read stays off deliberately.
clipboard_control       write-clipboard write-primary

# clean copy: strip TUI box borders/padding (raw copy stays on ctrl+shift+c)
map ctrl+alt+c          pass_selection_to_program ~/scripts/kitty-copy-clean.sh

# ===== tmux-style C-a prefix lane (kitty-as-multiplexer trial, 2026-10-16) =====
# Same keys as tmux.conf. Kitty "tabs" = tmux windows (per project); kitty
# splits = tmux panes. Apps that want a literal ctrl+a get it with
# ctrl+a ctrl+a — identical to the tmux/send-prefix habit, no regression.
# Not ported: C-a S popup (tmux-session model), vim-aware pane routing
# (C-arrows now always navigate kitty panes), tmux status bar (waybar).
# scrollback ≈ tmux history-limit 25000
scrollback_lines        100000
# stack layout = tmux's `z` zoom; splits = tmux-style free panes (the tall
# layout does not support hsplit/vsplit — that's why C-a " did nothing)
enabled_layouts         splits,stack
allow_remote_control    socket-only
listen_on               unix:/tmp/kitty-{pid}

map ctrl+a>ctrl+a       send_text all \x01
map ctrl+a>r            load_config_file
map ctrl+a>c            new_tab_with_cwd
map ctrl+a>n            next_tab
map ctrl+a>p            previous_tab
map ctrl+a>1            goto_tab 1
map ctrl+a>2            goto_tab 2
map ctrl+a>3            goto_tab 3
map ctrl+a>4            goto_tab 4
map ctrl+a>5            goto_tab 5
map ctrl+a>6            goto_tab 6
map ctrl+a>7            goto_tab 7
map ctrl+a>8            goto_tab 8
map ctrl+a>9            goto_tab 9
map ctrl+a>&            close_tab
map ctrl+a>x            close_window
map ctrl+a>d            close_window  # agent state survives in the opencode server
map ctrl+a>z            toggle_layout stack
map ctrl+a>up           neighboring_window up
map ctrl+a>down         neighboring_window down
map ctrl+a>left         neighboring_window left
map ctrl+a>right        neighboring_window right
# tmux parity: the -n (prefix-less) pane navigation you had in tmux.conf.
# Same tradeoff as tmux: these keys are pane-nav in kitty windows too, so
# shell word-jump/vim window-move on C-arrows doesn't exist in this lane
# (tmux never passed them either — the guard was what you had).
map ctrl+left           neighboring_window left
map ctrl+down           neighboring_window down
map ctrl+up             neighboring_window up
map ctrl+right          neighboring_window right
# tmux `"` quotes are dead keys on BR layouts — kitty never sees the char
# to match, so that bind is unreachable; the taboo line picks `-, which is
# live on every layout (mnemonic: split below, the horizontal line).
map ctrl+a>-            launch --location=hsplit --cwd=current
map ctrl+a>%            launch --location=vsplit --cwd=current
map ctrl+a>u            launch --type=background uairctl toggle
map ctrl+a>N            launch --type=background uairctl next
map ctrl+a>p            paste_from_clipboard
map ctrl+a>P            launch --type=background --cwd=current ~/scripts/kitty-print.sh

# C-a S: tmux-style popup over a PERSISTENT per-project tmux session
# (srv-<project name>). Close it freely — servers keep running on tmux's
# server side; same binding reattaches. Pickup: `--cwd=current` = the
# overlay launches in the current pane's directory (like tmux -d).
map ctrl+a>S            launch --type=overlay --cwd=current ~/scripts/srv-popup.sh

# resurrect/continuum pair: C-a C-s saves layout+cwd+commands to
# ~/.local/share/kitty-mux/session.kitty (the user timer saves every 5 min);
# restoring after a reboot = `kitty-mux-restore.sh` (or a bare `kitty
# --session ~/.local/share/kitty-mux/session.kitty`). The service in each
# devcontainer keeps agent sessions, so opencode windows resume into their
# sessions; plain-shell scrollbacks are the only thing not resurrected —
# same contract as tmux resurrect.
map ctrl+a>ctrl+s       launch --type=background ~/scripts/kitty-mux-save.py

# tab bar: bottom (kitty default), numbers on every tab, rename via the same
# key tmux uses (C-a ,). An empty name in the prompt returns the tab to the
# dynamic app title. Visible only when ≥2 tabs — waybar owns the single-tab case.
tab_bar_min_tabs        2
tab_title_template      {index}: {title}
map ctrl+a>,            set_tab_title


# kitty +kitten themes --reload-in=all

include themes/noctalia.conf
